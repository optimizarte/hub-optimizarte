<title>OPTIMIZARTE WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --occ-red:    #DC0028;
  --occ-red-d:  #B8001F;
  --occ-dark:   #202020;
  --occ-gray:   #414141;
  --occ-gray2:  #BEBEBE;
  --occ-gray3:  #E7E6E6;
  --occ-white:  #FFFFFF;
  --occ-bg:     #F0F0F0;
  --occ-border: #E0E0E0;
  --occ-radius: 8px;
  --occ-shadow: 0 2px 8px rgba(0,0,0,.10);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--occ-bg);
  color: var(--occ-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
  height: 52px;
  background: #1e1e1e;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 3px;
}
.brand-opt {
  font-family: 'Poppins', Arial, sans-serif;
  font-weight: 800;
  font-size: .9rem;
  color: #fff;
  letter-spacing: -.01em;
}
.brand-by {
  font-size: .58rem;
  color: rgba(255,255,255,.35);
  font-style: italic;
  margin: 0 2px;
}
.brand-occ {
  font-family: 'Poppins', Arial, sans-serif;
  font-weight: 800;
  font-size: .9rem;
  color: var(--occ-red);
  letter-spacing: -.01em;
}

.topbar-right { text-align: right; }
.topbar-title {
  font-family: 'Poppins', Arial, sans-serif;
  font-size: .76rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.topbar-sub {
  font-size: .58rem;
  color: rgba(255,255,255,.38);
  margin-top: 1px;
}

/* ── CONTENT ── */
.content {
  flex: 1;
  padding: 20px 16px 28px;
  max-width: 620px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── SECTION PILL ── */
.sec-pill {
  display: inline-block;
  background: var(--occ-red);
  color: #fff;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* ── QR CARD ── */
.qr-card {
  background: var(--occ-white);
  border: 1px solid var(--occ-border);
  border-radius: var(--occ-radius);
  border-top: 3px solid var(--occ-red);
  padding: 24px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.qr-wrap {
  background: #fff;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid var(--occ-border);
  display: inline-flex;
}

.qr-number {
  font-family: 'Poppins', Arial, sans-serif;
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--occ-dark);
  letter-spacing: .04em;
}

.qr-hint {
  font-size: .72rem;
  color: var(--occ-gray);
  text-align: center;
  max-width: 280px;
  line-height: 1.55;
}

/* ── LINK CARDS GRID ── */
.links-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

@media (max-width: 440px) {
  .links-grid { grid-template-columns: 1fr; }
}

.link-card {
  background: var(--occ-white);
  border: 1px solid var(--occ-border);
  border-radius: var(--occ-radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.link-card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.link-icon-wrap {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: #f9eded;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.link-icon-wrap svg {
  width: 18px;
  height: 18px;
}

.link-meta { flex: 1; }

.link-title {
  font-family: 'Poppins', Arial, sans-serif;
  font-size: .8rem;
  font-weight: 700;
  color: var(--occ-dark);
  line-height: 1.3;
}

.link-label {
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--occ-gray);
  margin-top: 2px;
}

.link-preview {
  font-size: .7rem;
  color: var(--occ-gray);
  font-style: italic;
  line-height: 1.45;
  border-left: 2px solid var(--occ-gray3);
  padding-left: 8px;
}

.link-actions {
  display: flex;
  gap: 7px;
}

.btn-primary {
  flex: 1;
  background: #25D366;
  color: #fff;
  border: none;
  border-radius: 5px;
  padding: 8px 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: background .15s;
  line-height: 1;
}
.btn-primary:hover { background: #1aad53; }

.btn-copy {
  background: var(--occ-bg);
  border: 1px solid var(--occ-border);
  border-radius: 5px;
  padding: 8px 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--occ-gray);
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.btn-copy:hover { color: var(--occ-dark); border-color: var(--occ-gray2); }
.btn-copy.copied { color: #1a7a3c; border-color: #1a7a3c; }

/* ── FOOTER ── */
.footer-bar {
  background: #1e1e1e;
  color: rgba(255,255,255,.38);
  font-size: .6rem;
  text-align: center;
  padding: 10px 16px;
  letter-spacing: .02em;
  flex-shrink: 0;
}

/* Occident logo row */
.occ-logo {
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <span class="brand-opt">Optimizarte</span>
    <span class="brand-by">by</span>
    <span class="brand-occ">Occident</span>
  </div>
  <div class="topbar-right">
    <div class="topbar-title">Contacte WhatsApp</div>
    <div class="topbar-sub">Agència #17167 · Figueres</div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- QR -->
  <div>
    <div class="sec-pill">Codi QR · Oficina</div>
    <div class="qr-card">
      <div class="occ-logo">
        <svg viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg" height="28">
          <path d="M18 6C11.4 6 6 11.4 6 18C6 27.6 18 42 18 42C18 42 30 27.6 30 18C30 11.4 24.6 6 18 6Z" fill="#DC0028"/>
          <circle cx="18" cy="18" r="5" fill="white"/>
          <text x="36" y="28" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#202020">Occident</text>
        </svg>
      </div>
      <div class="qr-wrap" id="qr-main"></div>
      <div class="qr-number">+34 972 426 665</div>
      <div class="qr-hint">Escaneja per iniciar una conversa de WhatsApp directament amb l'agència</div>
    </div>
  </div>

  <!-- Links -->
  <div>
    <div class="sec-pill">Missatges predefinits</div>
    <div class="links-grid" id="links-grid"></div>
  </div>

</div>

<!-- FOOTER -->
<div class="footer-bar">
  OPTIMIZARTE 3.0 SL · Mediador #17167 · Figueres · Bot gestionat per SendPulse
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var NUMBER = '34972426665';
var BASE   = 'https://wa.me/' + NUMBER;

var links = [
  {
    label: 'Consultes',
    title: 'Consulta general',
    preview: '"Hola! Vull obtenir informació sobre les vostres assegurances."',
    text:   "Hola! Vull obtenir informació sobre les assegurances d'OPTIMIZARTE.",
    icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="#DC0028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
  },
  {
    label: 'Pòlisses',
    title: 'Renovació de pòlissa',
    preview: '"Hola! Vull consultar la renovació de la meva pòlissa."',
    text:   'Hola! Vull consultar la renovació de la meva pòlissa.',
    icon: '<polyline points="23 4 23 10 17 10" fill="none" stroke="#DC0028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" fill="none" stroke="#DC0028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
  },
  {
    label: 'Comercial',
    title: 'Sol·licitar pressupost',
    preview: '"Hola! M\'agradaria rebre un pressupost per una assegurança."',
    text:   "Hola! M'agradaria rebre un pressupost per una assegurança.",
    icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="#DC0028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="14 2 14 8 20 8" fill="none" stroke="#DC0028" stroke-width="2"/><line x1="16" y1="13" x2="8" y2="13" stroke="#DC0028" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="17" x2="8" y2="17" stroke="#DC0028" stroke-width="2" stroke-linecap="round"/><polyline points="10 9 9 9 8 9" stroke="#DC0028" stroke-width="2" stroke-linecap="round"/>'
  },
  {
    label: 'Sinistres',
    title: 'Atenció a sinistres',
    preview: '"Hola! Necessito ajuda amb un sinistre."',
    text:   'Hola! Necessito ajuda amb un sinistre.',
    icon: '<circle cx="12" cy="12" r="10" fill="none" stroke="#DC0028" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="#DC0028" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke="#DC0028" stroke-width="2.5" stroke-linecap="round"/>'
  }
];

// QR
new QRCode(document.getElementById('qr-main'), {
  text: BASE,
  width: 160,
  height: 160,
  colorDark: '#000000',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.M
});

// Cards
var grid = document.getElementById('links-grid');

links.forEach(function(link) {
  var url = BASE + '?text=' + encodeURIComponent(link.text);
  var card = document.createElement('div');
  card.className = 'link-card';
  card.innerHTML =
    '<div class="link-card-top">' +
      '<div class="link-icon-wrap"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + link.icon + '</svg></div>' +
      '<div class="link-meta">' +
        '<div class="link-label">' + link.label + '</div>' +
        '<div class="link-title">' + link.title + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="link-preview">' + link.preview + '</div>' +
    '<div class="link-actions">' +
      '<a href="' + url + '" target="_blank" class="btn-primary">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>' +
        'Obrir' +
      '</a>' +
      '<button class="btn-copy" data-url="' + url + '" onclick="copyLink(this)">Copiar</button>' +
    '</div>';
  grid.appendChild(card);
});

function copyLink(btn) {
  var url = btn.getAttribute('data-url');
  var original = btn.textContent;
  function showCopied() {
    btn.classList.add('copied');
    btn.textContent = '✓ Copiat';
    setTimeout(function() { btn.classList.remove('copied'); btn.textContent = original; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(showCopied).catch(function() { fallback(url, showCopied); });
  } else { fallback(url, showCopied); }
}

function fallback(text, cb) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e) {}
  document.body.removeChild(ta);
}
</script>
