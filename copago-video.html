<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Quieres copago y no lo sabes · Vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF7;--bg2:#FFFFFF;--bg3:#F4F3EF;--bg4:#ECEBE6;--br:#E5E3DE;--brl:#CFCDC7;--t1:#15161A;--t2:#4F5059;--t3:#8A8B93;--t4:#B4B5BC;--brand:#DC0028;--brand-dim:rgba(220,0,40,.07);--brand-dim2:rgba(220,0,40,.15);--ade:#3B9DF8;--ade-dim:rgba(59,157,248,.12);--ok:#1f9d55;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15161A;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
body.rec{background:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:540px;height:960px;background:var(--bg);overflow:hidden;flex:none;transform-origin:center center}
#stage.land{width:960px;height:540px}
.ic{display:inline-block;flex-shrink:0;vertical-align:middle;background-size:contain;background-repeat:no-repeat;background-position:center;width:24px;height:24px;font-style:normal}
b{font-weight:600}
em{font-style:normal;color:var(--brand)}
/* cabecera */
#top{position:absolute;left:0;right:0;top:0;height:56px;background:var(--bg2);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 30px;z-index:5}
.l1{font-family:Catalana,Georgia,serif;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.05}
.by{font-family:Arial,sans-serif;font-size:11px;font-weight:500;color:var(--t3);margin:0 4px}.occ{font-family:Catalana,Georgia,serif;font-weight:700;color:var(--brand)}
.ls{font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:2px}
#prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--brand);width:0}
.land #top{height:48px}
/* escenas */
.sc{position:absolute;left:0;right:0;top:56px;bottom:0;padding:30px 34px 26px;display:none;flex-direction:column;justify-content:center;gap:22px}
.land .sc{top:48px;flex-direction:row;align-items:center;gap:38px;padding:22px 44px}
.sc>div{min-width:0}.land .sc>div{flex:1}
.kick{font-size:12px;color:var(--t3);letter-spacing:1.1px;text-transform:uppercase;font-weight:600}
h1{font-size:50px;font-weight:700;letter-spacing:-.025em;line-height:1.08}
h2{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
.land h1{font-size:46px}.land h2{font-size:31px}
.lead{font-size:19px;color:var(--t2);margin-top:12px}
.card{background:var(--bg2);border:1px solid var(--br);border-radius:16px;padding:18px 20px;box-shadow:0 6px 20px -8px rgba(15,15,30,.10),0 2px 4px rgba(15,15,30,.05)}
/* escena 1 */
.ecg{width:100%;height:60px;margin-top:6px}.ecg path{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420}
.fam{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:10px}
.fam>div{background:var(--bg3);border:1px solid var(--br);border-radius:14px;padding:12px 2px 10px;text-align:center;font-size:15px;font-weight:600}
.fam .ic{display:block;width:84px;height:84px;margin:0 auto 4px}.fam small{display:block;font-size:12.5px;font-weight:400;color:var(--t3)}
.land .fam .ic{width:74px;height:74px}
/* escena 2 */
.pl{display:flex;align-items:center;gap:16px;background:var(--bg2);border:2px solid var(--br);border-radius:16px;padding:14px 18px}
.pl.best{border-color:var(--brand);background:linear-gradient(var(--brand-dim),var(--brand-dim)),var(--bg2)}
.pl .ic{width:62px;height:62px}.pl .nm{font-size:21px;font-weight:600}.pl .tg{font-size:13px;color:var(--t3);font-weight:500}
.pl .pr{margin-left:auto;text-align:right}.pl .pm{font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1}.pl .pm small{font-size:16px;color:var(--t2)}
.pl.best .pm{color:var(--brand)}.pl .pa{font-size:14px;color:var(--t2);margin-top:3px}
.diff{background:var(--t1);color:#fff;border-radius:16px;padding:18px 22px;text-align:center}
.diff .dl{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.diff .dn{font-size:66px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:4px 0}.diff .dn small{font-size:30px;color:#ff8da1}
.diff .ds{font-size:16px;color:rgba(255,255,255,.85)}.diff .ds b{color:#ff8da1}
/* escena 3 */
.once{display:flex;gap:16px;align-items:center;background:var(--brand-dim);border:1px solid var(--brand-dim2);border-left:5px solid var(--brand);border-radius:14px;padding:16px 18px}
.once .ic{width:66px;height:66px}.once .t1{font-size:21px;font-weight:700;line-height:1.2}.once .t2{font-size:14.5px;color:var(--t2);margin-top:4px;line-height:1.4}
.ctrl label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--t3)}
.ctrl label span{font-size:46px;color:var(--brand);letter-spacing:-.02em;text-transform:none;font-weight:600;line-height:1}
.trk{position:relative;height:64px}
.trk .tb{position:absolute;left:0;right:0;top:27px;height:12px;border-radius:99px;background:var(--bg4);box-shadow:inset 0 0 0 1px var(--br)}
.trk .tf{position:absolute;left:0;top:27px;height:12px;border-radius:99px;background:var(--brand)}
.trk .th{position:absolute;top:2px;width:60px;height:60px;margin-left:-30px;border-radius:50%;border:3px solid var(--brand);background-color:#fff;background-position:center;background-size:42px;background-repeat:no-repeat;box-shadow:0 4px 12px rgba(15,15,30,.25)}
.brow{margin-top:14px}.brow .rl{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:600;margin-bottom:6px}.brow .rl .t{font-size:28px;font-weight:600;letter-spacing:-.02em}
.bar{height:22px;background:var(--bg3);border:1px solid var(--br);border-radius:99px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.bar .p{background:var(--t3)}.bar .c{background:repeating-linear-gradient(45deg,var(--t3),var(--t3) 4px,var(--brl) 4px,var(--brl) 8px)}
.rA .p{background:var(--ade)}.rA .c{background:repeating-linear-gradient(45deg,var(--ade),var(--ade) 4px,rgba(59,157,248,.35) 4px,rgba(59,157,248,.35) 8px)}
.r20 .p{background:var(--brand)}.r20 .c{background:repeating-linear-gradient(45deg,var(--brand),var(--brand) 4px,rgba(220,0,40,.35) 4px,rgba(220,0,40,.35) 8px)}
.verdict{display:flex;gap:14px;align-items:center;background:var(--brand-dim);border:1px solid var(--brand-dim2);border-radius:14px;padding:16px 18px;font-size:19px;color:var(--t2);line-height:1.4}
.verdict .ic{width:56px;height:56px}.verdict b{color:var(--t1)}.verdict .hl{color:var(--brand);font-weight:700}
/* escena 4 */
.big{font-size:70px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--brand)}
.sub{font-size:16px;color:var(--t2)}
#chart{width:100%;height:auto;display:block;background:var(--bg3);border:1px solid var(--br);border-radius:14px}
.slots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}.slots .ic{width:100%;height:auto;aspect-ratio:1}.slots .off{opacity:.13;filter:grayscale(1)}.slots .half{opacity:.5;filter:grayscale(.35)}
.eqb{display:flex;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--br);border-radius:14px;padding:14px 16px;font-size:18px;color:var(--t2)}.eqb .ic{width:60px;height:60px}.eqb b{color:var(--t1)}
/* escena 5 */
.pills3{display:flex;gap:8px}.pills3 .pp{flex:1;min-width:0;border-radius:26px;padding:12px 4px 10px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.pp span{font-size:13.5px;font-weight:600}.pp b{color:#fff;font-size:25px;font-weight:700;letter-spacing:-.02em}.pp b small{font-size:13px;font-weight:600}.pp i{font-style:normal;font-size:12px;opacity:.9}
.pp.sin{background:var(--t3)}.pp.adv{background:var(--ade)}.pp.c20{background:var(--brand)}
.team{display:flex;gap:10px}.team>div{flex:1;background:var(--bg3);border:1px solid var(--br);border-radius:14px;padding:10px 4px 8px;text-align:center;font-size:14px;font-weight:600}.team .ic{display:block;width:60px;height:60px;margin:0 auto 4px}
.cta{background:var(--bg2);border-top:6px solid var(--brand);border-radius:16px;padding:20px;text-align:center;box-shadow:0 6px 20px -8px rgba(15,15,30,.12)}
.cta h3{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.wa{display:inline-flex;align-items:center;gap:10px;background:var(--wa);color:#fff;border-radius:99px;padding:8px 24px 8px 8px;font-size:20px;font-weight:700;margin-top:14px;text-decoration:none}
.wa .ci{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff}.wa .ci .ic{width:34px;height:34px}
.cta .ct{margin-top:10px;font-size:15px;color:var(--t2)}.cta .ct b{font-size:19px}
.legal{font-size:11px;color:var(--t3);line-height:1.4}
/* controles */
#ctl{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:6;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0))}
#pp{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:14px;cursor:pointer;line-height:1}
#seek{flex:1;height:6px;background:var(--bg4);border-radius:99px;position:relative;cursor:pointer}#seekf{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:99px;width:0}
#tm{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;width:74px;text-align:right}
body.rec #ctl,body.rec #prog{display:none}
#sound{display:none}

const TX={
es:{ls:'Seguro de Salud',kE:'Simulación · Familia de ejemplo',kC:'Simulación personalizada',h1:'Quieres <em>copago</em> y no lo sabes',fE:n=>n>=3?'Nuestra familia de ejemplo':'Nuestro ejemplo',fC:n=>n>=3?'Tu familia':'Tus asegurados',
 h2:'Mismo cuadro médico. <em>Distinta prima.</em>',nSin:'Sin copago',n20:'Copago 20',gC:'La más cara',gE:'Equilibrada',gB:'La más económica',mes:'/mes',an:'al año',
 dl:'Diferencia de prima al año',ds:v=>`Es lo que cuesta <b>no tener copago</b> · equivale a <b>${v}</b> visitas con copago de 20 €`,
 o1:'Un único copago de 20 € por centro y día',o2:'<b>Ejemplo:</b> consulta, análisis y ecografía el mismo día en el mismo centro: pagas una sola vez.',q1:'Visitas al año (familia)',
 vd:(s,e)=>`Solo en este año, <b>Copago 20 te ahorra <span class="hl">${s}</span></b>. Para que sin copago saliera a cuenta, habría que ir <span class="hl">${e}</span> veces al médico en un año.`,
 h4:'Y si lo inviertes <em>al 3 %</em>',q4:'Dentro de',yr:y=>y===1?'1 año':y+' años',al:'Ahorro acumulado · Copago 20',eq:(f,y)=>`Con <b>${f}</b> pagarías <b>${y} años</b> de tu seguro Copago 20.`,
 h5:'Cuidamos de tu familia. <em>Y de tu bolsillo.</em>',tD:'Médicos',tN:'Enfermería',tH:'Hospitales',rm:'Recuerda los precios (por mes)',ct:'Consulta con nosotros tu caso personalizado',
 lg:p=>`Simulación basada en supuestos (uso médico del simulador y rentabilidad del ${p} % anual compuesta, no garantizada). Primas constantes: a más edad, más ahorro.`,
 wa:'Hola, he visto el vídeo del simulador de Copago 20. Quiero un estudio personalizado de seguro de salud para mi familia.',
 age:a=>a===1?'1 año':a+' años',lab:{baby:'Bebé',boyH:'Niño',girlM:'Niña',teenH:'Joven',teenM:'Joven',adultH:'Hombre',adultM:'Mujer',oldH:'Abuelo',oldM:'Abuela'}},
ca:{ls:'Assegurança de Salut',kE:'Simulació · Família d\'exemple',kC:'Simulació personalitzada',h1:'Vols <em>copagament</em> i no ho saps',fE:n=>n>=3?'La nostra família d\'exemple':'El nostre exemple',fC:n=>n>=3?'La teva família':'Els teus assegurats',
 h2:'Mateix quadre mèdic. <em>Diferent prima.</em>',nSin:'Sense copagament',n20:'Copagament 20',gC:'La més cara',gE:'Equilibrada',gB:'La més econòmica',mes:'/mes',an:'a l\'any',
 dl:'Diferència de prima a l\'any',ds:v=>`És el que costa <b>no tenir copagament</b> · equival a <b>${v}</b> visites amb copagament de 20 €`,
 o1:'Un únic copagament de 20 € per centre i dia',o2:'<b>Exemple:</b> consulta, anàlisi i ecografia el mateix dia al mateix centre: pagues una sola vegada.',q1:'Visites a l\'any (família)',
 vd:(s,e)=>`Només en aquest any, <b>Copagament 20 t\'estalvia <span class="hl">${s}</span></b>. Perquè sense copagament sortís a compte, caldria anar <span class="hl">${e}</span> vegades al metge en un any.`,
 h4:'I si ho inverteixes <em>al 3 %</em>',q4:'D\'aquí a',yr:y=>y===1?'1 any':y+' anys',al:'Estalvi acumulat · Copagament 20',eq:(f,y)=>`Amb <b>${f}</b> pagaries <b>${y} anys</b> de la teva assegurança Copagament 20.`,
 h5:'Cuidem la teva família. <em>I la teva butxaca.</em>',tD:'Metges',tN:'Infermeria',tH:'Hospitals',rm:'Recorda els preus (per mes)',ct:'Consulta amb nosaltres el teu cas personalitzat',
 lg:p=>`Simulació basada en supòsits (ús mèdic del simulador i rendibilitat del ${p} % anual compost, no garantida). Primes constants: a més edat, més estalvi.`,
 wa:'Hola, he vist el vídeo del simulador de Copagament 20. Vull un estudi personalitzat d\'assegurança de salut per a la meva família.',
 age:a=>a===1?'1 any':a+' anys',lab:{baby:'Nadó',boyH:'Nen',girlM:'Nena',teenH:'Jove',teenM:'Jove',adultH:'Home',adultM:'Dona',oldH:'Avi',oldM:'Àvia'}}}[L];
function persona(p,i){const a=p.age,Hh=p.sex==='H';let ic,lb;
 if(a<=2){ic='bebe';lb=TX.lab.baby;}else if(a<=12){ic=Hh?'nino':'nina';lb=Hh?TX.lab.boyH:TX.lab.girlM;}else if(a<=17){ic=Hh?'nino':'nina';lb=TX.lab.teenH;}
 else if(a<=64){ic=Hh?'papa':'mama';lb=Hh?TX.lab.adultH:TX.lab.adultM;}else{ic=Hh?'abuelo':'abuela';lb=Hh?TX.lab.oldH:TX.lab.oldM;}
 return {ic,lb:(names[i]&&names[i].trim())||lb,age:a};}
function costes(n,h){const hl=Math.min(h,LIBRES),ol=Math.max(0,LIBRES-hl);
 return {c0:{p:PRIMA.c0,c:0},adv:{p:PRIMA.adv,c:COPAGO*Math.max(0,n-ol)+ALTO*(h-hl)},c20:{p:PRIMA.c20,c:COPAGO*n+ALTO*h}};}
const tot=o=>o.p+o.c;
const mr=Math.pow(1+RENT,1/12)-1, fv=(a,y)=>mr>0?(a/12)*(Math.pow(1+mr,y*12)-1)/mr:a*y;
const $=id=>document.getElementById(id);
const CF=costes(N,H), S20=PRIMA.c0-tot(CF.c20), A20=Math.max(0,S20), D=PRIMA.c0-PRIMA.c20, VIS=Math.floor(D/COPAGO);
let EQ=0;while(EQ<5000&&PRIMA.c20+costes(EQ,H).c20.c<PRIMA.c0)EQ++;
const YMAX=20;

/* ---------- textos y estructura estática ---------- */
document.documentElement.lang=L;document.title=TX.h1.replace(/<[^>]+>/g,'')+' · '+(L==='ca'?'Vídeo':'Vídeo');
$('ls').textContent=TX.ls;$('k1').textContent=MODE==='c'?TX.kC:TX.kE;$('h1').innerHTML=TX.h1;
$('fl').textContent=(MODE==='c'?TX.fC:TX.fE)(NP);
$('fam').style.setProperty('--c',Math.min(NP,4));
$('fam').innerHTML=people.map((p,i)=>{const q=persona(p,i);return `<div class="a-pop" data-in="${(1.8+i*.45).toFixed(2)}" data-sc="sc1"><i class="ic i-${q.ic}"></i>${esc(q.lb)}<small>${TX.age(q.age)}</small></div>`;}).join('');
$('h2').innerHTML=TX.h2;$('dl').textContent=TX.dl;$('ds').innerHTML=TX.ds(nf(VIS));
$('n0').textContent=TX.nSin;$('g0').textContent=TX.gC;$('g1').textContent=TX.gE;$('n2').textContent=TX.n20;$('g2').textContent=TX.gB;
$('o1').textContent=TX.o1;$('o2').innerHTML=TX.o2;$('q1').textContent=TX.q1;$('b0n').textContent=TX.nSin;$('b2n').textContent=TX.n20;
$('h4').innerHTML=TX.h4;$('q4').textContent=TX.q4;$('al').textContent=TX.al;
$('h5').innerHTML=TX.h5;$('tD').textContent=TX.tD;$('tN').textContent=TX.tN;$('tH').textContent=TX.tH;$('rm').textContent=TX.rm;$('ct').textContent=TX.ct;
$('lg').textContent=TX.lg(String(RENT*100).replace('.',L==='ca'?',':','));
[['pp0',TX.nSin,'c0'],['pp1','Advance','adv'],['pp2',TX.n20,'c20']].forEach(([id,n,k])=>{$(id).innerHTML=`<span>${n}</span><b>${eur(MES[k],2)}<small>${TX.mes}</small></b><i>${eur(PRIMA[k],2)} ${TX.an}</i>`;});
$('vd').innerHTML=TX.vd(eur(S20),EQ);
$('slots').innerHTML=Array.from({length:12},()=>'<i class="ic i-ahorro off"></i>').join('');
$('wa').href='https://wa.me/34972426665?text='+encodeURIComponent(TX.wa);

/* ---------- línea de tiempo ---------- */
const SC=[['sc1',0,6],['sc2',6,13.5],['sc3',13.5,24],['sc4',24,33],['sc5',33,41]];
const TOTAL=SC[SC.length-1][2];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>1-Math.pow(1-x,3), prog=(t,a,d)=>ease(clamp((t-a)/d));
const anim=[...document.querySelectorAll('.a-up,.a-pop')].map(el=>({el,sc:el.closest('.sc').id,d:+el.dataset.in,pop:el.classList.contains('a-pop')}));
const ST={}; SC.forEach(s=>ST[s[0]]=s[1]);
const chartAt=(y)=>{
  const W=360,Hh=210,L0=50,R=12,T0=14,B=26,w=W-L0-R,h=Hh-T0-B, ym=fv(A20,YMAX)*1.08||1;
  const X=x=>L0+x/YMAX*w, Y=v=>T0+h-v/ym*h, tx='style="fill:var(--t3);font-family:Inter,sans-serif"';
  let g='';for(let i=0;i<=3;i++){const v=ym*i/3;g+=`<line x1="${L0}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--br)"/><text x="${L0-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" ${tx}>${nf(v)}</text>`;}
  [5,10,15,20].forEach(t=>g+=`<text x="${X(t)}" y="${Hh-8}" text-anchor="middle" font-size="10" ${tx}>${t}</text>`);
  const pts=[];for(let k=0;k<=Math.max(1,Math.round(y*8));k++){const yy=Math.min(y,k/8);pts.push([yy,fv(A20,yy)]);}
  const P=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const e=pts[pts.length-1];
  return g+`<path d="M${X(0)} ${Y(0)}L${X(y)} ${Y(A20*y)}" style="stroke:var(--t4)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>`+
   `<path d="${P} L${X(y)} ${Y(0)} L${X(0)} ${Y(0)}Z" style="fill:var(--brand-dim)"/><path d="${P}" style="stroke:var(--brand)" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`+
   `<circle cx="${X(e[0])}" cy="${Y(e[1])}" r="6" style="fill:var(--brand);stroke:var(--bg2)" stroke-width="2.5"/>`;
};
const K=1.1, TT=TOTAL*K;   // K = 1,10 → todo el vídeo un 10 % más lento
window.__total=TT;
window.__render=function(T){
  T=clamp(T,0,TT);const t=Math.min(T/K,TOTAL-0.0001);   // al final se queda en la pantalla de precios y contacto
  SC.forEach(([id,a,b])=>{const el=$(id),on=t>=a&&t<b;el.style.display=on?'flex':'none';if(on){const o=Math.min(clamp((t-a)/.35),clamp((b-t)/.35));el.style.opacity=id==='sc5'&&t>=b-.35?1:o;}});
  anim.forEach(o=>{const lt=t-ST[o.sc],p=prog(lt,o.d,o.pop?.45:.55);o.el.style.opacity=p;o.el.style.transform=o.pop?`scale(${.6+.4*p})`:`translateY(${(1-p)*26}px)`;});
  // 1
  $('ecg').style.strokeDashoffset=420*(1-prog(t,.4,2.2));
  // 2
  const l2=t-ST.sc2;
  [['m0','a0','c0',.9],['m1','a1','adv',1.7],['m2','a2','c20',2.5]].forEach(([m,a,k,d])=>{const p=prog(l2,d,1.1);$(m).innerHTML=eur(MES[k]*p,2)+'<small>'+TX.mes+'</small>';$(a).textContent=eur(PRIMA[k]*p,2)+' '+TX.an;});
  $('dn').textContent=nf(D*prog(l2,4.6,1.6));
  // 3
  const l3=t-ST.sc3, mx=Math.max(PRIMA.c0,PRIMA.adv,PRIMA.c20+0)*1.02;
  const maxN=Math.max(40,20*NP), v=Math.round(N*prog(l3,3.8,2.8)), cc=costes(v,H);
  $('vn').textContent=v;const pc=v/maxN*100;$('tf').style.width=pc+'%';$('th').style.left=`calc(${pc}% )`;
  const tt=Math.max(tot(cc.c0),tot(cc.adv),tot(cc.c20))*1.02;
  [['0','c0'],['1','adv'],['2','c20']].forEach(([i,k])=>{$('b'+i+'p').style.width=cc[k].p/tt*100+'%';$('b'+i+'c').style.width=cc[k].c/tt*100+'%';$('t'+i).textContent=eur(tot(cc[k]));});
  // 4
  const l4=t-ST.sc4, y=1+(YMAX-1)*prog(l4,1.6,5.6), yi=Math.max(1,Math.round(y));
  $('vy').textContent=TX.yr(yi);const py=(y-1)/(24-1)*100;$('tf4').style.width=py+'%';$('th4').style.left=py+'%';
  $('bg').textContent=eur(fv(A20,y));$('chart').innerHTML=chartAt(y);
  $('slots').innerHTML=Array.from({length:12},(_,i)=>{const full=(i+1)*2<=yi,half=!full&&i*2<yi;return `<i class="ic i-ahorro${full?'':half?' half':' off'}"></i>`;}).join('');
  $('eq4').innerHTML=TX.eq(eur(fv(A20,y)),dec1(fv(A20,y)/PRIMA.c20));
  // progreso
  $('prog').style.width=(T/TT*100)+'%';$('seekf').style.width=(T/TT*100)+'%';
  const s=Math.floor(T);$('tm').textContent=`0:${String(s).padStart(2,'0')} / 0:${String(Math.floor(TT)).padStart(2,'0')}`;
};

/* ---------- formato, escalado y reproducción ---------- */
const st=$('stage');
function fit(){const land=Q.get('o')==='h'?true:Q.get('o')==='v'?false:innerWidth>innerHeight;st.classList.toggle('land',land);
 const w=land?960:540,h=land?540:960;if(REC){st.style.transform='none';return;}st.style.transform=`scale(${Math.min(innerWidth/w,innerHeight/h)})`;}
if(REC)document.body.classList.add('rec');
addEventListener('resize',fit);fit();
const th=getComputedStyle(document.documentElement);
let cur=0,playing=!REC,last=0;
function loop(ts){if(playing){if(!last)last=ts;cur+=(ts-last)/1000;last=ts;if(cur>=TT){cur=TT;playing=false;$('pp').textContent='↻';}window.__render(cur);}else last=0;requestAnimationFrame(loop);}
$('pp').onclick=()=>{if(cur>=TT)cur=0;playing=!playing;last=0;$('pp').textContent=playing?'❚❚':'▶';};
$('seek').onclick=e=>{const r=$('seek').getBoundingClientRect();cur=clamp((e.clientX-r.left)/r.width)*TT;window.__render(cur);};
window.__render(0);if(!REC)requestAnimationFrame(loop);
window.__ready=(document.fonts&&document.fonts.ready)||Promise.resolve();
</script>
