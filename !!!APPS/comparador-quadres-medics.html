<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparador de quadres mèdics · OPTIMIZART€ by Occident</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Comparador de quadres mèdics · estil OPTICRM */
.app{--bg:#FAFAF7;--bg2:#FFFFFF;--bg3:#F4F3EF;--bg4:#ECEBE6;--br:#E5E3DE;--brl:#CFCDC7;--t1:#15161A;--t2:#4F5059;--t3:#8A8B93;--t4:#B4B5BC;--brand:#DC0028;--radius:10px;--radius-lg:14px;
--shadow-card:0 1px 0 rgba(15,15,30,.03),0 1px 3px rgba(15,15,30,.05);--shadow-md:0 6px 20px -8px rgba(15,15,30,.10),0 2px 4px rgba(15,15,30,.05);
--b1:#B3232F;--b2:#3B9DF8;--b3:#E0A100;--b4:#16A34A;--x1:#DC0028;--x2:#3B9DF8;--x3:#C98A00;--x4:#16A34A;
background:var(--bg);color:var(--t1);min-height:100vh;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app[data-t="1"]{--bg:#0E0F12;--bg2:#171820;--bg3:#1E1F28;--bg4:#282933;--br:#2B2C36;--brl:#3A3B47;--t1:#F2F2F5;--t2:#B6B7C1;--t3:#7F808B;--t4:#55565F;--shadow-card:0 1px 0 rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);--shadow-md:0 8px 24px -8px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.35);
--b1:#C9404F;--b2:#66B3FF;--b3:#F2B825;--b4:#3DBE6C;--x1:#F0304F;--x2:#66B3FF;--x3:#F2B825;--x4:#3DBE6C}
*{box-sizing:border-box}body{margin:0}
button,select,input{font-family:inherit}button{cursor:pointer;border:none;background:transparent;font-size:13px;color:inherit;line-height:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ic{display:inline-block;flex-shrink:0;vertical-align:middle;background-size:contain;background-repeat:no-repeat;background-position:center;width:24px;height:24px;font-style:normal}
.bg1{background:var(--b1)}.bg2{background:var(--b2)}.bg3{background:var(--b3)}.bg4{background:var(--b4)}
.tx1{color:var(--x1)}.tx2{color:var(--x2)}.tx3{color:var(--x3)}.tx4{color:var(--x4)}
/* header */
#hdr{position:sticky;top:0;z-index:20;min-height:56px;background:var(--bg2);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 18px;gap:14px;flex-wrap:wrap}
.oa-logo{display:flex;flex-direction:column;line-height:1.05}.oa-logo .l1{font-family:Catalana,Georgia,serif;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--t1)}
.oa-logo .by{font-family:Arial,Helvetica,sans-serif;font-size:9.5px;font-weight:500;color:var(--t3);margin:0 3px}.oa-logo .occ{font-family:Catalana,Georgia,serif;font-weight:700;color:var(--brand)}
.oa-logo .ls{font-size:8.5px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;font-weight:600;margin-top:1px}
.hd{width:1px;height:22px;background:var(--br)}.hsp{flex:1}
.vtabs{display:flex;flex-wrap:wrap;border-radius:999px;background:var(--bg3);border:1px solid var(--br);padding:3px;gap:2px}
.vt{border-radius:999px;background:transparent;font-size:12px;font-weight:500;padding:6px 13px;color:var(--t3);display:inline-flex;align-items:center;gap:6px;transition:all .12s;text-decoration:none;white-space:nowrap}
.vt:hover:not(.on){background:var(--bg2);color:var(--t1)}.vt.on{background:var(--bg2);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.thb{display:grid;place-items:center;min-width:30px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--br);background:var(--bg3);color:var(--t2);transition:all .12s;font-size:12px;font-weight:600}.thb:hover{border-color:var(--brand);background:var(--bg2)}
main{max-width:1200px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--bg2);border:1px solid var(--br);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-card)}
.st{display:flex;align-items:center;gap:10px;margin-bottom:4px}.st .ic{width:42px;height:42px}.st h2{margin:0;font-size:16px;font-weight:600;color:var(--t1);letter-spacing:-.01em}.st small{display:block;font-size:11px;color:var(--t3);font-weight:400}
.sub{margin:2px 0 12px;color:var(--t3);font-size:12px}
/* càrrega */
.zonebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.zonebar>span{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.slot{border:1px solid var(--br);border-radius:var(--radius);background:var(--bg3);padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color .12s}.slot.over{border-color:var(--brand);background:var(--bg2)}
.slot .sh{display:flex;align-items:center;gap:8px}.slot .sh .ic{width:34px;height:34px}
.slot input.nm{flex:1;min-width:0;border:1px solid var(--br);background:var(--bg2);color:var(--t1);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.slot .xb{width:26px;height:26px;border-radius:999px;border:1px solid var(--br);background:var(--bg2);color:var(--t3);font-size:12px}.slot .xb:hover{border-color:var(--brand);color:var(--brand)}
.drop{border:1.5px dashed var(--brl);border-radius:var(--radius);padding:14px 10px;text-align:center;color:var(--t3);font-size:12px;cursor:pointer;background:var(--bg2)}.drop:hover{border-color:var(--brand);color:var(--t1)}.drop b{color:var(--t1);font-weight:600}
.drop.file{border-style:solid;text-align:left;display:flex;gap:8px;align-items:center}.drop .fn{font-size:11.5px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prog{height:6px;border-radius:999px;background:var(--bg4);overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .15s}
.sstat{font-size:11px;color:var(--t3);line-height:1.4}.sstat.err{color:var(--brand)}.sstat b{color:var(--t1);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pillb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--br);border-radius:999px;background:var(--bg2);color:var(--t1);font-size:12px;font-weight:600;padding:7px 14px;transition:border-color .12s}.pillb:hover{border-color:var(--brand)}
.hint{font-size:11px;color:var(--t3);margin:10px 0 0}
/* hero */
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--br);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:22px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.heroin{display:flex;gap:16px;align-items:center;max-width:680px}.heroin>.ic{width:79px;height:79px}
.kick{font-size:10.5px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;font-weight:600}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--t1);margin:3px 0 4px;line-height:1.15}h1 span{color:var(--brand)}.hero p{margin:0;color:var(--t2)}
.vs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--br);border-radius:999px;background:var(--bg2);color:var(--t1);font-size:13.5px;font-weight:600;padding:4px 16px 4px 5px;white-space:nowrap}.cbtn .ic{width:35px;height:35px}
.vsb{font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:.08em}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{display:flex;align-items:center;gap:14px;background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:12px 16px;transition:border-color .12s}.kpi:hover{border-color:var(--brand)}
.kpi>.ic{width:52px;height:52px}.kb{flex:1;min-width:0}.kl{font-size:11.5px;color:var(--t2);font-weight:500;line-height:1.3}
.kv{display:flex;align-items:baseline;gap:7px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}.kv b{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--t1)}.kv.n3 b,.kv.n4 b{font-size:24px}.kv i{font-size:11px;color:var(--t4);font-style:normal}.ks{font-size:10.5px;color:var(--t3);margin-top:3px;line-height:1.3}
/* gràfic */
.bar-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--t2)}.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--br);border-radius:999px;background:var(--bg2);padding:3px 11px 3px 4px}.lg .ic{width:22px;height:22px}
.cat{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:6px 0;border-top:1px solid var(--br);gap:10px;flex-wrap:wrap}
.cat .cn{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--t1)}.cat .cn .ic{width:33px;height:33px}.catcov{font-size:11px;color:var(--t3)}.catcov b{font-weight:600}
.rowbtn{display:grid;align-items:center;width:100%;text-align:left;padding:3px 6px;border-radius:8px;transition:background .12s}.rowbtn:hover{background:var(--bg3)}
.rowbtn.bf{grid-template-columns:1fr 210px 1fr}.lab{font-weight:500;color:var(--t1);font-size:12.5px;padding:0 6px;line-height:1.25}.bf .lab{text-align:center}
.side{display:flex;align-items:center;gap:8px;height:26px;min-width:0}.side.l{justify-content:flex-end}
.bar{height:14px;width:0;border-radius:999px;animation:g .8s ease forwards;max-width:calc(100% - 30px)}@keyframes g{to{width:var(--w)}}
.num{font-size:13px;font-weight:600;letter-spacing:-.01em;min-width:10px;text-align:center}.side.l .num{order:-1}
.none{font-size:10.5px;color:var(--t4);padding:2px 10px;background:var(--bg3);border:1px dashed var(--br);border-radius:999px;line-height:1.4;white-space:nowrap}
.detail{display:none;gap:12px;margin:2px 6px 8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.row.open .detail{display:grid}
.detail>div{border:1px solid var(--br);border-radius:var(--radius);background:var(--bg3);padding:8px 10px}
.detail h5{margin:0 0 5px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px}.detail h5 .ic{width:20px;height:20px}
.detail ul{margin:0;padding:0;list-style:none}.detail li{border:1px solid var(--br);border-radius:8px;padding:5px 9px;margin-bottom:4px;font-size:11.5px;background:var(--bg2);color:var(--t1);font-weight:600;line-height:1.35}.detail li small{display:block;font-weight:400;color:var(--t3);font-size:10.5px}.detail li.muted{color:var(--t4);font-weight:400;background:transparent;border-style:dashed}
.vt.b{border:none}
/* cobertura */
.covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.cov{border:1px solid var(--br);border-radius:var(--radius);background:var(--bg3);padding:10px 12px}
.covt{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;color:var(--t1);line-height:1.2}.covt .ic{width:33px;height:33px}.covt span{margin-left:auto;font-weight:400;color:var(--t3);font-size:11px;white-space:nowrap}
.covb{margin-top:7px;height:16px;background:var(--bg4);border-radius:999px;position:relative;overflow:hidden}.covb i{display:block;height:100%;border-radius:999px}.covb em{position:absolute;right:8px;top:0;font-size:10px;line-height:16px;font-style:normal;font-weight:700;color:var(--t1)}.covb i+em.w{color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px;padding:3px 12px 3px 5px;border-radius:999px;background:var(--bg2);color:var(--t2);border:1px solid var(--br)}.chip .ic{width:22px;height:22px}
.note{font-size:11px;color:var(--t3);margin:10px 0 0}.empty{font-size:12px;color:var(--t4);padding:4px 0}
.cens{display:flex;flex-direction:column;gap:5px;max-height:520px;overflow:auto;padding-right:2px}
.cen{border:1px solid var(--br);border-radius:8px;padding:6px 10px;background:var(--bg2);font-size:11.5px;transition:border-color .12s}.cen:hover{border-color:var(--brand)}
.cenh{display:flex;justify-content:space-between;gap:8px;align-items:center}.cenh b{font-weight:600;color:var(--t1)}
.tag{font-size:10px;padding:1px 7px;border-radius:5px;font-weight:600;color:#fff;white-space:nowrap}.cen small{color:var(--t3);font-size:10.5px}
.tt{width:100%;border-collapse:collapse;font-size:12.5px}.tt th{text-align:left;font-size:10.5px;font-weight:600;color:var(--t3);border-bottom:1px solid var(--br);padding:4px}.tt td{padding:7px 4px;border-bottom:1px solid var(--br)}.tt .n{font-size:17px;font-weight:600}
.pc h3{font-size:12px;font-weight:600;color:var(--t1);margin:12px 0 6px}
.pl{list-style:none;margin:0;padding:0}.pl li{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--br);border-radius:8px;padding:6px 9px;margin-bottom:5px;font-size:12px;background:var(--bg2);color:var(--t2);line-height:1.4}.pl li .ic{width:22px;height:22px;margin-top:-2px}.pl li b{color:var(--t1);font-weight:600}
.notes ul{margin:6px 0 0;padding-left:18px;font-size:11.5px;color:var(--t2)}
.warn{border:1px solid var(--brand);background:rgba(220,0,40,.06);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--t1);margin-top:8px}
.footer-bar{background:var(--bg2);border-top:1px solid var(--br);color:var(--t3);font-size:10.5px;text-align:center;padding:10px}
.hidden{display:none!important}
@media(max-width:860px){.rowbtn.bf{grid-template-columns:1fr 130px 1fr}h1{font-size:24px}#hdr .vtabs.nav{display:none}}

      '<div class="kpi">' + ic('ok') + '<div class="kb"><div class="kl">' + t('k_common') + '</div><div class="ks">' + fmt(t('k_common_s'), { x: nTot - common }) + '</div></div>' + kvc([common], false) + '</div></section>';

      const rs = rows.filter(r => r.sp.cat === c.id); if (!rs.length) return;
      const cc = act.map((_, k) => rs.filter(r => r.counts[k] > 0).length);
      chart += '<div class="cat" data-cat="' + c.id + '"><span class="cn">' + ic(c.icon) + esc(catName(c)) + '</span><span class="catcov">' + cc.map((n, k) => '<b class="tx' + cls(k) + '">' + n + '/' + rs.length + '</b> ' + nameOf(k)).join(' · ') + '</span></div>';
      rs.forEach(r => {
        const all = r.counts.every(x => x > 0), only = r.counts.filter(x => x > 0).length === 1;
        const detail = '<div class="detail">' + act.map((_, k) => '<div><h5 class="tx' + cls(k) + '">' + ic(slotIcon(act[k]), 20) + nameOf(k) + ' · ' + r.counts[k] + '</h5><ul>' + lst(r.lists[k]) + '</ul></div>').join('') + '</div>';
        let btn;
        if (N === 2) btn = '<button class="rowbtn bf"><div class="side l">' + barCell(r.counts[0], 0, 'l') + '</div><div class="lab">' + esc(specName(r.sp)) + '</div><div class="side r">' + barCell(r.counts[1], 1, 'r') + '</div></button>';
        else btn = '<button class="rowbtn" style="grid-template-columns:210px repeat(' + N + ',minmax(0,1fr))"><div class="lab">' + esc(specName(r.sp)) + '</div>' + act.map((_, k) => '<div class="side">' + barCell(r.counts[k], k, 'r').replace('<b class="num', '<b class="num') + '</div>').join('') + '</button>';
        chart += '<div class="row" data-all="' + (all ? 1 : 0) + '" data-only="' + (only ? r.counts.findIndex(x => x > 0) : -1) + '" style="' + (filt(r) ? '' : 'display:none') + '">' + btn + detail + '</div>';
      });
    });
    h += '<section class="card" id="especialitats"><div class="st">' + ic('estadistica') + '<div><h2>' + t('sp_t') + '</h2><small>' + t('sp_s') + '</small></div></div><div class="bar-tools filters"><div class="vtabs">' + tabs.map(x => '<button class="vt' + (S.filter === x[0] ? ' on' : '') + '" data-f="' + x[0] + '">' + esc(x[1]) + '</button>').join('') + '</div>' + legend + '</div><div class="chart">' + chart + '</div></section>';
    /* cobertura */
    let cv = '';
    Core.CATS.forEach(c => {
      const rs = rows.filter(r => r.sp.cat === c.id); if (!rs.length) return;
      cv += '<div class="cov"><div class="covt">' + ic(c.icon) + esc(catName(c)) + '<span>' + rs.length + ' ' + t('esp') + '</span></div>' + act.map((_, k) => { const p = Math.round(rs.filter(r => r.counts[k] > 0).length / rs.length * 100); return '<div class="covb"><i class="bg' + cls(k) + '" style="width:' + p + '%"></i><em class="' + (p > 85 ? 'w' : '') + '">' + p + '%</em></div>'; }).join('') + '</div>';
    });
    h += '<section class="card"><div class="st">' + ic('grafica') + '<div><h2>' + t('cov_t') + '</h2><small>' + t('cov_s') + '</small></div></div><div style="height:8px"></div><div class="covgrid">' + cv + '</div></section>';
    /* exclusives */
    if (N > 1) {
      h += '<section class="two">' + act.map((_, k) => {
        const ex = rows.filter(r => r.counts[k] > 0 && r.counts.filter(x => x > 0).length === 1);
        return '<div class="card"><div class="st">' + ic(slotIcon(act[k])) + '<div><h2>' + t('only_t') + ' ' + nameOf(k) + ' · ' + ex.length + '</h2><small>' + t('only_s') + '</small></div></div><div style="height:8px"></div>' +
          (ex.length ? '<div class="chips">' + ex.map(r => '<span class="chip">' + ic(Core.CATS.find(c => c.id === r.sp.cat).icon) + esc(specName(r.sp)) + '</span>').join('') + '</div>' : '<div class="empty">' + t('only_none') + '</div>') + '</div>';
      }).join('') + '</section>';
    }
    /* xarxes */
    h += '<section class="two" id="centres">' + act.map((_, k) => {
      const a = A[k];
      const gs = a.groups.slice().sort((x, y) => y.specs.size - x.specs.size);
      return '<div class="card"><div class="st">' + ic('comercio') + '<div><h2>' + t('net_t') + ' ' + nameOf(k) + ' · ' + gs.length + ' ' + t('pts') + '</h2><small>' + t('net_s') + '</small></div></div><div style="height:8px"></div><div class="cens">' +
        gs.map(g => '<div class="cen"><div class="cenh"><b>' + esc(g.name) + '</b><span class="tag bg' + cls(k) + '">' + g.specs.size + ' ' + t('esp') + '</span></div><small>' + esc([g.townName ? Core.tidyTown(g.townName) : '', g.addr].filter(Boolean).join(' · ')) + '</small></div>').join('') + '</div></div>';
    }).join('') + '</section>';
    /* territori */
    const towns = [...new Set([].concat(...A.map(a => Object.keys(a.towns))))].sort((a, b) => Math.max(...A.map(x => x.towns[b] || 0)) - Math.max(...A.map(x => x.towns[a] || 0)));
    h += '<section class="card"><div class="st">' + ic('diana') + '<div><h2>' + t('terr_t') + '</h2><small>' + t('terr_s') + '</small></div></div><div style="height:6px"></div><table class="tt"><tr><th>' + t('mun') + '</th>' + act.map((_, k) => '<th>' + nameOf(k) + '</th>').join('') + '</tr>' +
      (towns.length ? towns.map(tw => '<tr><td>' + esc(tw) + '</td>' + A.map((a, k) => '<td class="n tx' + cls(k) + '">' + (a.towns[tw] || '—') + '</td>').join('') + '</tr>') : '<tr><td colspan="' + (N + 1) + '" class="empty">n/d</td></tr>').join('') +
      (A.some(a => a.unknownTown) ? '<tr><td style="color:var(--t3)">' + t('k_mun_s') + '</td>' + A.map(a => '<td style="color:var(--t3)">' + (a.unknownTown || '—') + '</td>').join('') + '</tr>' : '') + '</table></section>';
    /* pros/contres automàtics */
    h += '<section class="two" id="pros">' + act.map((_, k) => {
      const pros = [], cons = [];
      const others = idx => cov.filter((_, j) => j !== idx);
      const oMax = N > 1 ? Math.max(...others(k)) : 0;
      if (N > 1 && cov[k] > oMax) pros.push(fmt(t('p_more_spec'), { a: cov[k], b: oMax }));
      if (N === 1) pros.push(fmt(t('p_one'), { a: cov[k] }));
      const cenMax = Math.max(...A.map((a, j) => j !== k ? a.groups.length : 0));
      if (N > 1 && A[k].groups.length > cenMax) pros.push(fmt(t('p_more_cen'), { a: A[k].groups.length, b: cenMax }));
      if (N > 1 && mun[k] > Math.max(...mun.filter((_, j) => j !== k)) && mun[k] > 1) pros.push(fmt(t('p_mun'), { a: mun[k] }));
      const ex = rows.filter(r => r.counts[k] > 0 && r.counts.filter(x => x > 0).length === 1);
      if (N > 1 && ex.length) pros.push(fmt(t('p_excl'), { l: ex.slice(0, 4).map(r => specName(r.sp)).join(', ') + (ex.length > 4 ? ' +' + (ex.length - 4) + ' ' + t('more') : '') }));
      const choice = rows.filter(r => r.counts[k] >= 3).length;
      const chOther = Math.max(0, ...A.map((a, j) => j !== k ? rows.filter(r => r.counts[j] >= 3).length : 0));
      if (choice > 0 && (N === 1 || choice > chOther)) pros.push(fmt(t('p_choice'), { a: choice }));
      const hasOdon = r => r.sp.id === 'odon', hasUrg = r => r.sp.id === 'urg';
      const dental = rows.find(hasOdon); if (dental && dental.counts[k] > 0 && (N === 1 || dental.counts.some((c, j) => j !== k && c === 0))) pros.push(t('p_dental'));
      const urg = rows.find(hasUrg); if (urg && urg.counts[k] > 0 && N === 1) pros.push(t('p_urg'));
      /* contres */
      const miss = rows.filter(r => r.counts[k] === 0 && r.counts.some(c => c > 0));
      if (miss.length) cons.push(fmt(t('c_missing'), { a: miss.length, l: miss.slice(0, 4).map(r => specName(r.sp)).join(', ') + (miss.length > 4 ? ' +' + (miss.length - 4) + ' ' + t('more') : '') }));
      const mine = rows.filter(r => r.counts[k] > 0); const single = mine.filter(r => r.counts[k] === 1).length;
      if (mine.length && single / mine.length >= 0.6) cons.push(fmt(t('c_single'), { a: single, b: mine.length }));
      if (mun[k] === 1 && Math.max(...mun) > 1) cons.push(t('c_onemun'));
      if (mun[k] === 0) cons.push(t('c_nomun'));
      if (N > 1 && A[k].groups.length * 2 <= Math.max(...A.map(a => a.groups.length))) cons.push(fmt(t('c_fewcen'), { a: A[k].groups.length }));
      const li = (ok, x) => '<li>' + ic(ok ? 'ok' : 'ko') + '<span>' + x + '</span></li>';
      return '<div class="card pc" style="box-shadow:inset 0 3px 0 var(--b' + cls(k) + '),var(--shadow-card)"><div class="st">' + ic(slotIcon(act[k])) + '<div><h2>' + nameOf(k) + '</h2><small>' + t('pros_s') + '</small></div></div><h3>' + t('pro') + '</h3><ul class="pl">' + (pros.length ? pros.map(x => li(1, x)).join('') : '<li>' + ic('ok') + '<span>' + t('none_pc') + '</span></li>') + '</ul><h3>' + t('con') + '</h3><ul class="pl">' + (cons.length ? cons.map(x => li(0, x)).join('') : '<li>' + ic('ok') + '<span>' + t('none_pc') + '</span></li>') + '</ul></div>';
    }).join('') + '</section>';
    h += '<section class="card notes"><div class="st">' + ic('nota') + '<div><h2>' + t('notes_t') + '</h2><small>' + t('notes_s') + '</small></div></div><ul><li>' + t('n1') + '</li><li>' + t('n2') + '</li><li>' + t('n3') + '</li><li>' + t('n4') + '</li></ul></section>';
    box.innerHTML = h;
  }

  /* ---- esquelet ---- */
  function renderShell() {
    const app = $('.app'); app.dataset.t = S.theme;
    $('#hdr-tabs').innerHTML = [['carrega', 'nav_load'], ['resum', 'nav_sum'], ['especialitats', 'nav_spec'], ['centres', 'nav_cen'], ['pros', 'nav_pros']].map((x, i) => '<a class="vt' + (i ? '' : ' on') + '" href="#' + x[0] + '">' + t(x[1]) + '</a>').join('');
    $('#ls').textContent = t('tool');
    $('#load-t').textContent = t('load_t'); $('#load-s').textContent = t('load_s');
    $('#btn-ex').innerHTML = ic('hospital', 20) + t('ex'); $('#btn-clear').textContent = t('clear'); $('#btn-print').textContent = t('print'); $('#hint').textContent = t('hint');
    $('#lang').textContent = S.lang === 'ca' ? 'ES' : 'CA'; $('#th').textContent = S.theme === '1' ? '☀' : '☾';
    renderZoneBar(); renderSlots(); renderResults();
  }
  function demo() {
    const d = JSON.parse(document.getElementById('demo-data').textContent);
    ['Cosalud', 'Adeslas'].forEach((n, i) => { const sl = S.slots[i]; sl.name = n; sl.entries = d[i]; sl.status = 'ready'; sl.file = n + ' · exemple'; sl.total = d[i].length; });
    S.zone = 'ibiza'; S.filter = 'all'; invalidate(); renderZoneBar(); renderSlots(); renderResults();
  }
  function bind() {
    document.addEventListener('click', e => {
      const z = e.target.closest('[data-zone]'); if (z) { S.zone = z.dataset.zone; invalidate(); renderZoneBar(); renderSlots(); renderResults(); return; }
      const f = e.target.closest('[data-f]'); if (f) { S.filter = f.dataset.f; renderResults(); return; }
      const rb = e.target.closest('.rowbtn'); if (rb) { rb.parentElement.classList.toggle('open'); return; }
      const pk = e.target.closest('[data-pick]'); if (pk) { const inp = $('#file'); inp.dataset.slot = pk.dataset.pick; inp.value = ''; inp.click(); return; }
      const rm = e.target.closest('[data-rm]'); if (rm) { const i = +rm.dataset.rm; S.slots[i] = { name: '', entries: null, status: 'empty', msg: '', progress: 0, file: '', total: 0 }; invalidate(); renderSlots(); renderResults(); return; }
      if (e.target.closest('#btn-ex')) { demo(); return; }
      if (e.target.closest('#btn-clear')) { S.slots = S.slots.map(() => ({ name: '', entries: null, status: 'empty', msg: '', progress: 0, file: '', total: 0 })); invalidate(); renderSlots(); renderResults(); return; }
      if (e.target.closest('#btn-print')) { window.print(); return; }
      if (e.target.closest('#lang')) { S.lang = S.lang === 'ca' ? 'es' : 'ca'; document.documentElement.lang = S.lang; renderShell(); return; }
      if (e.target.closest('#th')) { S.theme = S.theme === '1' ? '0' : '1'; renderShell(); return; }
    });
    document.addEventListener('input', e => { const n = e.target.closest('[data-name]'); if (n) { S.slots[+n.dataset.name].name = n.value; renderResults(); } });
    $('#file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(+e.target.dataset.slot, f); });
    document.addEventListener('dragover', e => { const s = e.target.closest('.slot'); if (s) { e.preventDefault(); s.classList.add('over'); } });
    document.addEventListener('dragleave', e => { const s = e.target.closest('.slot'); if (s) s.classList.remove('over'); });
    document.addEventListener('drop', e => {
      const s = e.target.closest('.slot'); document.querySelectorAll('.slot.over').forEach(x => x.classList.remove('over'));
      if (!s) return; e.preventDefault();
      const files = [...e.dataTransfer.files].filter(f => /\.pdf$/i.test(f.name));
      let idx = +s.dataset.slot;
      files.forEach(f => { while (idx < MAXSLOTS && S.slots[idx].status === 'loading') idx++; if (idx < MAXSLOTS) loadFile(idx++, f); });
    });
    window.addEventListener('scroll', () => {
      const ids = ['carrega', 'resum', 'especialitats', 'centres', 'pros']; let cur = ids[0];
      ids.forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 120) cur = id; });
      document.querySelectorAll('#hdr-tabs .vt').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
    }, { passive: true });
  }
  window.__hub = { S, loadFile, demo, model };
  document.addEventListener('DOMContentLoaded', () => { bind(); renderShell(); });
})();
</script>
</body></html>
