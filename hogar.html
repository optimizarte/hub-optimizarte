<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Seguro de hogar · Occident</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Estilo OPTICRM · tokens de la fitxa */
.app{--bg:#FAFAF7;--bg2:#FFFFFF;--bg3:#F4F3EF;--bg4:#ECEBE6;--br:#E5E3DE;--brl:#CFCDC7;--t1:#15161A;--t2:#4F5059;--t3:#8A8B93;--t4:#B4B5BC;--brand:#DC0028;--brand-ink:#B20021;--brand-dim:rgba(220,0,40,.07);--brand-dim2:rgba(220,0,40,.15);
--radius-sm:6px;--radius:10px;--radius-lg:14px;--shadow-sm:0 1px 2px rgba(15,15,30,.05);--shadow-card:0 1px 0 rgba(15,15,30,.03),0 1px 3px rgba(15,15,30,.05);--shadow-md:0 6px 20px -8px rgba(15,15,30,.10),0 2px 4px rgba(15,15,30,.05);
--cos:#DC0028;--ade:#3B9DF8;--cos-dim:rgba(220,0,40,.07);--ade-dim:rgba(59,157,248,.12);--ok:#1f9d55;
background:var(--bg);color:var(--t1);min-height:100vh;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;max-width:520px;margin:0 auto;position:relative;padding-bottom:96px;box-shadow:0 0 40px rgba(0,0,0,.10)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}body{background:#dedcd6}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;font-size:13px;color:inherit;line-height:1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
b{font-weight:600;color:var(--t1)}
.ic{display:inline-block;flex-shrink:0;vertical-align:middle;background-size:contain;background-repeat:no-repeat;background-position:center;width:24px;height:24px;font-style:normal}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s,transform .55s}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation:none!important}}

/* header */
#hdr{position:sticky;top:0;z-index:20;min-height:56px;background:var(--bg2);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 16px;gap:12px;padding-top:env(safe-area-inset-top)}
.oa-logo{display:flex;flex-direction:column;line-height:1.05}.oa-logo .l1{font-family:Catalana,Georgia,serif;font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--t1)}
.oa-logo .by{font-family:Arial,Helvetica,sans-serif;font-size:9.5px;font-weight:500;color:var(--t3);margin:0 4px}.oa-logo .occ{font-family:Catalana,Georgia,serif;font-weight:700;color:var(--brand)}
.oa-logo .ls{font-size:8.5px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;font-weight:600;margin-top:2px}
.hsp{flex:1}
.thb{display:grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--br);background:var(--bg3);color:var(--t2);font-size:15px}
#prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--brand);width:0}
main{padding:16px 14px 24px;display:flex;flex-direction:column;gap:14px}

/* cards */
.card{background:var(--bg2);border:1px solid var(--br);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card)}
.st{display:flex;align-items:center;gap:10px;margin-bottom:4px}.st .ic{width:44px;height:44px}.st h2{font-size:17px;font-weight:600;color:var(--t1);letter-spacing:-.01em;line-height:1.25}.st small{display:block;font-size:11.5px;color:var(--t3);font-weight:400;letter-spacing:0;margin-top:1px}
.sub{margin:4px 0 12px;color:var(--t3);font-size:12.5px}
.kick{font-size:10.5px;color:var(--t3);letter-spacing:.9px;text-transform:uppercase;font-weight:600}
.hero{background:var(--bg2);border:1px solid var(--br);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:20px 18px 18px 22px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.heroin{display:flex;gap:14px;align-items:flex-start}.heroin>.ic{width:64px;height:64px;margin-top:2px}
h1{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--t1);margin:3px 0 6px;line-height:1.15}h1 span{color:var(--brand)}
.hero p{color:var(--t2);font-size:14px}
.fam{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:8px;margin-top:8px}.fam div{background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:10px 2px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--t1)}.fam .ic{display:block;width:64px;height:64px;margin:0 auto 2px}.fam small{display:block;font-size:11px;font-weight:400;color:var(--t3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--br);border-radius:999px;background:var(--bg3);color:var(--t1);font-size:12px;font-weight:600;padding:5px 12px}
.ecg{width:100%;height:46px;margin-top:10px}.ecg path{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:ecg 3.2s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:0}}

/* kpi */
.kpi{display:flex;align-items:center;gap:14px;background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:12px 14px}
.kpi>.ic{width:52px;height:52px}.kb{flex:1;min-width:0}.kl{font-size:11.5px;color:var(--t2);font-weight:500;line-height:1.3}.ks{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.35}
.kv b{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--t1)}.kv b.cos{color:var(--cos)}.kv i{font-size:13px;color:var(--t4);font-style:normal;margin-left:2px}
.hero .kpi{margin-top:14px}

/* planes */
.swipe{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 0;padding:6px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.swipe::-webkit-scrollbar{display:none}
.plan{flex:0 0 78%;scroll-snap-align:center;background:var(--bg2);border:1px solid var(--br);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px;position:relative}
.plan.best{border-color:var(--brand);background:linear-gradient(var(--brand-dim),var(--brand-dim)),var(--bg2)}
.plan .top{display:flex;align-items:center;gap:10px}.plan .top .ic{width:48px;height:48px}.plan h3{font-size:15px;font-weight:600;color:var(--t1)}
.tag{display:inline-block;border:1px solid var(--br);border-radius:999px;background:var(--bg2);color:var(--t3);font-size:10px;font-weight:600;letter-spacing:.4px;padding:2px 9px;margin-top:3px}
.best .tag{border-color:var(--brand);color:var(--brand);background:var(--bg2)}.mid .tag{border-color:var(--ade);color:var(--ade)}
.plan .y small{font-size:15px;font-weight:600;color:var(--t2);letter-spacing:0}.plan .y{font-size:34px;font-weight:600;letter-spacing:-.02em;color:var(--t1);margin-top:12px;line-height:1.1}.plan.best .y{color:var(--brand)}
.plan .m{font-size:15px;font-weight:600;color:var(--t2)}
.plan p{font-size:12.5px;color:var(--t2);margin-top:10px;line-height:1.45}
.plan .d{margin-top:10px;padding-top:10px;border-top:1px solid var(--br);font-size:12.5px;font-weight:600;color:var(--t2)}.plan .d.g{color:var(--ok)}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:7px;height:7px;border-radius:999px;background:var(--brl);transition:.25s}.dots i.on{background:var(--brand);width:20px}

/* presets */
.once{display:flex;gap:12px;align-items:center;background:var(--brand-dim);border:1px solid var(--brand-dim2);border-left:4px solid var(--brand);border-radius:var(--radius);padding:12px 14px;margin:12px 0 4px}.once .ic{width:48px;height:48px}.once .t1{font-size:15px;font-weight:700;color:var(--t1);line-height:1.25}.once .t2{font-size:12.5px;color:var(--t2);margin-top:3px;line-height:1.4}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.pre{display:flex;align-items:center;gap:9px;border:1.5px solid var(--br);border-radius:var(--radius);background:var(--bg3);padding:9px 10px;text-align:left;font-size:12.5px;font-weight:600;color:var(--t1);line-height:1.2;transition:all .12s}
.pre .ic{width:38px;height:38px}.pre small{display:block;font-weight:400;font-size:10.5px;color:var(--t3);margin-top:2px}
.pre.on{border-color:var(--brand);background:var(--brand-dim)}

/* slider fonendo */
.ctrl{margin-top:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--t3)}
.ctrl label span{font-size:30px;color:var(--brand);letter-spacing:-.02em;text-transform:none;font-weight:600;line-height:1}
.ctrl .hint{font-size:11.5px;color:var(--t3);margin-top:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:56px;background:transparent;outline:none;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(to right,var(--brand) var(--p),var(--bg4) var(--p));box-shadow:inset 0 0 0 1px var(--br)}
input[type=range]::-moz-range-track{height:10px;border-radius:999px;background:var(--bg4);box-shadow:inset 0 0 0 1px var(--br)}
input[type=range]::-moz-range-progress{height:10px;border-radius:999px;background:var(--brand)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;margin-top:-21px;border-radius:50%;border:2px solid var(--brand);background:var(--thumb) center/36px no-repeat,var(--bg2);box-shadow:0 3px 10px rgba(15,15,30,.25)}
input[type=range]::-moz-range-thumb{width:48px;height:48px;border-radius:50%;border:2px solid var(--brand);background:var(--thumb) center/36px no-repeat,var(--bg2);box-shadow:0 3px 10px rgba(15,15,30,.25)}

/* barras */
.bars{margin-top:6px}
.brow{margin-top:12px}
.brow .rl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:5px}
.brow .rl .t{font-size:20px;font-weight:600;letter-spacing:-.02em}
.bar{height:16px;background:var(--bg3);border:1px solid var(--br);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.bar .p{background:var(--t3)}.bar .c{background:repeating-linear-gradient(45deg,var(--t3),var(--t3) 4px,var(--brl) 4px,var(--brl) 8px)}
.rA .p{background:var(--ade)}.rA .c{background:repeating-linear-gradient(45deg,var(--ade),var(--ade) 4px,rgba(59,157,248,.35) 4px,rgba(59,157,248,.35) 8px)}
.r20 .p{background:var(--brand)}.r20 .c{background:repeating-linear-gradient(45deg,var(--brand),var(--brand) 4px,rgba(220,0,40,.35) 4px,rgba(220,0,40,.35) 8px)}
.legend{display:flex;gap:8px;margin-top:10px;font-size:11px;color:var(--t2)}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--br);border-radius:999px;background:var(--bg2);padding:3px 10px}.lg s{width:10px;height:10px;border-radius:3px;display:inline-block;text-decoration:none}
.verdict{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--brand-dim);border:1px solid var(--brand-dim2);border-radius:var(--radius);padding:12px 14px;font-size:13.5px;color:var(--t2)}
.verdict .ic{width:44px;height:44px}.verdict b{color:var(--t1)}.verdict .hl{color:var(--brand);font-weight:700}

/* ahorro */
.sv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.sv .k{background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:12px;text-align:left}
.sv .k.adv{border-color:var(--ade-dim)}
.sv .k .kl{display:flex;align-items:center;gap:6px}.sv .k .dot{width:8px;height:8px;border-radius:999px;background:var(--cos)}.sv .k.adv .dot{background:var(--ade)}
.sv .k .v{font-size:27px;font-weight:600;letter-spacing:-.02em;color:var(--t1);margin-top:6px;line-height:1.1}
.sv .k .u{font-size:11px;color:var(--t3);margin-top:2px}
.slots{display:grid;gap:4px;margin-top:12px}.slots.s10{grid-template-columns:repeat(10,minmax(0,1fr))}.slots.s12{grid-template-columns:repeat(12,minmax(0,1fr))}.slots .ic{width:100%;height:auto;aspect-ratio:1;transition:opacity .3s,filter .3s}.slots .half{opacity:.5;filter:grayscale(.35)}.slots .off{opacity:.13;filter:grayscale(1)}.slcap{font-size:11.5px;color:var(--t2);margin-top:8px}
.coins{display:flex;flex-wrap:wrap;gap:0;margin-top:12px;min-height:34px}.coins .ic{width:36px;height:36px;animation:pop .35s backwards}
@keyframes pop{from{transform:scale(0) rotate(-60deg)}}
.eq{margin-top:12px;border:1px solid var(--br);border-left:3px solid var(--brand);border-radius:var(--radius);background:var(--bg3);padding:11px 13px;font-size:13.5px;color:var(--t2)}.eq .green{color:var(--ok);font-weight:700}

/* inversión */
#chart{width:100%;height:auto;display:block;margin-top:12px;background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius)}
.inv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.inv .k{background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:12px}
.inv .k .v{font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--t1);margin-top:4px;line-height:1.1}
.inv .k .d{font-size:11px;color:var(--t3);line-height:1.35;margin-top:6px}
.split{height:7px;border-radius:999px;overflow:hidden;display:flex;margin-top:8px;background:var(--bg4)}.split i{display:block;height:100%}.split .a{background:var(--t4)}.split .r{background:var(--brand)}.adv .split .r{background:var(--ade)}
.legs{font-size:10.5px;color:var(--t3);margin-top:8px}
.kpi.piggy{margin-top:12px}.kpi.piggy .kl{font-size:13px;color:var(--t2);font-weight:400}

/* cierre */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.team div{background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:10px 4px 8px;text-align:center;font-size:11.5px;font-weight:600;color:var(--t1)}
.team .ic{display:block;width:52px;height:52px;margin:0 auto 4px}
.checks{list-style:none;margin-top:12px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--br);font-size:13.5px;color:var(--t2)}
.checks li:first-child{border-top:0}.checks .ic{width:22px;height:22px;margin-top:1px}
.footer-bar{background:var(--bg2);border-top:1px solid var(--br);color:var(--t3);font-size:10.5px;text-align:center;padding:14px 16px;line-height:1.45}

/* CTA */
#cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#25D366;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.18);border-radius:999px;padding:7px 20px 7px 7px;font-size:14px;font-weight:600;box-shadow:0 8px 20px -6px rgba(37,211,102,.65);text-decoration:none;border:0}
.pbtn .ci{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff}.pbtn .ci .ic{width:30px;height:30px}
.pbtn:active{background:#1ebe5a}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(15,15,30,.55);display:none;align-items:flex-end;justify-content:center}#sheet.open{display:flex}
#sheet .box{background:var(--bg2);color:var(--t1);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s;border:1px solid var(--br)}
@keyframes up{from{transform:translateY(100%)}}
#sheet h3{font-size:19px;font-weight:600;letter-spacing:-.01em}#sheet p{font-size:13px;color:var(--t2);margin:4px 0 12px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--br);background:var(--bg3);border-radius:999px;padding:6px 18px 6px 6px;margin-top:8px;color:var(--t1);text-decoration:none;font-size:14px;font-weight:600}
.opt .ic{width:42px;height:42px}.opt small{display:block;font-weight:400;font-size:11px;color:var(--t3)}.opt.main{border-color:#25D366;background:rgba(37,211,102,.10)}
#sheet .x{display:block;margin:12px auto 0;color:var(--t3);font-size:13px;padding:6px}


.pills3{display:flex;gap:6px;margin-top:8px}.pills3 .pl{flex:1;min-width:0;border-radius:22px;padding:9px 4px 8px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:1px;align-items:center}.pills3 .pl span{font-size:10.5px;font-weight:600;opacity:.95;line-height:1.2}.pills3 .pl b{color:#fff;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.2}.pills3 .pl b small{font-size:10px;font-weight:600;margin-left:1px}.pills3 .pl i{font-style:normal;font-size:9.5px;opacity:.9}.pills3 .sin{background:var(--t3)}.pills3 .adv{background:var(--ade)}.pills3 .c20{background:var(--brand)}


/* ===== extras DENTAL ===== */
.plan .y{font-size:28px}.plan.best .y{color:var(--ok)}
.plan.best{border-color:var(--ok);background:linear-gradient(rgba(31,157,85,.07),rgba(31,157,85,.07)),var(--bg2)}.plan.best .tag{border-color:var(--ok);color:var(--ok)}
.flow{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.flow div{display:flex;gap:10px;align-items:center;background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius);padding:9px 12px;font-size:12.5px;color:var(--t2)}
.flow b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--t1);color:#fff;display:grid;place-items:center;font-size:12px}
.pcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pcard{background:var(--bg3);border:1px solid var(--br);border-radius:var(--radius-lg);padding:14px}
.pcard .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pcard .top .ic{width:56px;height:56px}.pcard h3{font-size:15px;font-weight:600}
.pcard .chips{margin-top:6px}
.chip.g{background:var(--bg2)}
.chip em{font-style:normal;color:var(--ok);font-weight:700;margin-left:5px;font-size:10px}
.prow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--br);font-size:12.5px;color:var(--t2);margin-top:2px}.prow:first-of-type{margin-top:6px}.prow b{white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{display:flex;align-items:center;gap:9px;border:1.5px solid var(--br);border-radius:var(--radius);background:var(--bg3);padding:8px 10px;text-align:left;transition:all .12s}
.tile .ic{width:40px;height:40px}.tile b{display:block;font-size:20px;font-weight:700;line-height:1;color:var(--ok)}.tile small{display:block;font-size:11px;color:var(--t2);line-height:1.2;margin-top:2px}
.tile.on{border-color:var(--ok);background:rgba(31,157,85,.08)}
.crow{margin-top:12px}
.cl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--t1)}.cl .ic{width:28px;height:28px}.cl small{margin-left:auto;font-weight:400;color:var(--t3);font-size:11px}
.track{position:relative;height:14px;margin-top:5px;background:var(--bg3);border:1px solid var(--br);border-radius:999px}
.range{position:absolute;top:2px;bottom:2px;border-radius:999px;background:linear-gradient(90deg,var(--brand-dim2),var(--brand))}
.rv2{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:3px}.rv2 b{color:var(--t1)}
.presets{margin-top:10px}
.crw{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--br)}.crw:first-child{border-top:0}
.crw>.ic{width:38px;height:38px}.crw .cn{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.25}.crw .cn small{display:block;font-weight:400;font-size:11px;color:var(--t3)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--br);border-radius:999px;background:var(--bg3)}
.stp button{width:36px;height:36px;font-size:20px;font-weight:600;color:var(--brand);border-radius:999px}.stp button:active{background:var(--brand-dim)}
.stp b{min-width:28px;text-align:center;font-size:15px}
.total{margin-top:12px;background:var(--brand-dim);border:1px solid var(--brand-dim2);border-left:4px solid var(--brand);border-radius:var(--radius);padding:14px}
.total .tv{font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--brand);line-height:1.1;margin:4px 0 2px}
.fbar{display:flex;gap:8px;margin-top:10px}.fbar input,.fbar select{flex:1;min-width:0;border:1px solid var(--br);border-radius:999px;background:var(--bg3);padding:10px 14px;font:inherit;font-size:13.5px;color:var(--t1)}
.fbar select{flex:0 1 44%}.fbar input:focus,.fbar select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-dim)}
.segs{display:flex;gap:6px;margin-top:8px}.segs button{flex:1;border:1px solid var(--br);border-radius:999px;background:var(--bg3);color:var(--t2);font-size:12.5px;font-weight:600;padding:9px 6px}.segs button.on{background:var(--t1);border-color:var(--t1);color:#fff}
.fcount{font-size:11.5px;color:var(--t3);margin:8px 2px 4px}
.results{border:1px solid var(--br);border-radius:var(--radius);max-height:380px;overflow-y:auto;background:var(--bg2)}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--br)}.res:last-child{border-bottom:0}
.res .rn{font-size:13px;color:var(--t1);min-width:0}.res .ct{display:block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;color:var(--t3)}
.res .pr{font-weight:700;white-space:nowrap;font-size:13.5px}.res .pr.g{color:var(--ok);background:rgba(31,157,85,.1);padding:3px 11px;border-radius:999px;font-size:12px}
.empty{padding:26px;text-align:center;color:var(--t3);font-size:13px}
.pills3 .pl b{font-size:22px}

/* ===== VERSIÓN PC (web): body.pc = ancho >= 900 px o ?v=pc ===== */
.pc .app{max-width:1180px;padding-bottom:84px}
.pc main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:22px 26px 30px;align-items:start}
.pc main>section.full{grid-column:1/-1}
.pc .hero{display:grid;grid-template-columns:1.15fr 1fr;gap:34px;align-items:center;padding:26px 30px 26px 34px}
.pc h1{font-size:40px}.pc .hero p{font-size:15.5px;max-width:520px}.pc .heroin>.ic{width:84px;height:84px}
.pc .heroR .kick{margin-top:0!important}.pc .fam .ic{width:72px;height:72px}
.pc .card{padding:22px 26px}.pc .st h2{font-size:19px}.pc .st .ic{width:50px;height:50px}
.pc .swipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;overflow:visible;margin:12px 0 0;padding:10px 0 0}
.pc .plan{flex:none}.pc .dots{display:none}
.pc .flow{grid-template-columns:repeat(3,1fr);margin-top:8px}
.pc .pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pc .tiles{grid-template-columns:repeat(3,1fr)}
.pc .calcgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:34px;align-items:start}
.pc .calcR{position:sticky;top:76px}.pc .total{margin-top:0}
.pc .presets{grid-template-columns:repeat(3,1fr)}
.pc .results{max-height:420px}
.pc .team{max-width:520px}
.pc #cta{max-width:420px}
.pc .footer-bar{padding:16px 40px}


/* ===== extras HOGAR ===== */
.htx{min-width:0}
.hero .kpi{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;align-items:center;padding:10px 12px}.hero .kpi>.ic{width:44px;height:44px}.hero .kb{display:contents}.hero .kl{grid-column:2}.hero .kv,.hero .ks{grid-column:1/-1;text-align:center}
.pc .hero .kpi{grid-template-columns:44px minmax(0,1fr) auto}.pc #kpiLg{grid-column:3;grid-row:1}
.hero .kv b{font-size:27px}.pc .hero .kv b{font-size:40px}
button.kpi{width:100%;max-width:520px;margin:14px auto 0;text-align:left;cursor:pointer;font:inherit;color:inherit}
#kpiLg{display:none}.pc #kpiLg{display:block}#kpiLg .lg{width:78px;height:26px}
.pc .hero{display:block}.pc .hero p{max-width:none}
.cname{font-size:15px;font-weight:600}.lgw{display:inline-flex;align-items:center}
.note{margin-top:10px;border:1px solid var(--br);border-left:3px solid #B26A00;border-radius:var(--radius);background:#FFF8EC;padding:11px 13px;font-size:13px;color:#7A4A00}
.fn{font-size:11.5px;color:var(--t3);margin-top:8px;line-height:1.45}.fn:empty{display:none}
.pd{display:block;font-size:10.5px;font-weight:600;color:#B26A00;margin-top:2px}
.fr{font-size:11px;font-weight:500;color:var(--t3)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--bg2);border:1px solid var(--br);border-radius:var(--radius);overflow:hidden;margin-top:10px}
.dl>div{box-shadow:0 0 0 .5px var(--br);padding:9px 11px;min-width:0}.dl .tk{display:block;font-size:10px;color:var(--t3);letter-spacing:.6px;text-transform:uppercase;font-weight:600;margin-bottom:2px}.dl .tv2{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pc .dl{grid-template-columns:repeat(4,minmax(0,1fr))}
.bd{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:2px 9px;border:1px solid var(--br);background:var(--bg2);color:var(--t2);margin:6px 4px 0 0}
.bd.r{border-color:var(--brand);color:var(--brand)}.bd.a{background:#FFF4E5;border-color:#F2C27B;color:#7A4A00}.bd.u{background:var(--bg3)}
.pcs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.pc .pcs{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.po{border:1.5px solid var(--br);border-radius:var(--radius-lg);background:var(--bg3);padding:14px;min-width:0}
.po.rec{border-color:var(--brand);background:linear-gradient(var(--brand-dim),var(--brand-dim)),var(--bg2)}
.po .top{display:flex;align-items:center;min-height:28px}
.po .nm{font-size:14px;font-weight:600;margin-top:8px;line-height:1.25;overflow-wrap:anywhere}
.po .pr{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:8px}.po.rec .pr{color:var(--brand)}
.po .pm{font-size:12.5px;color:var(--t2);margin-top:2px}
.po .df{margin-top:8px;font-size:12.5px;font-weight:600}.po .df.g{color:var(--ok)}.po .df.r{color:#B26A00}
.bar2{height:9px;background:var(--bg4);border-radius:999px;margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--t3);border-radius:999px}.po.rec .bar2 i{background:var(--brand)}
.dfs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}.pc .dfs{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dfc{border:1px solid var(--br);border-radius:var(--radius-lg);background:var(--bg3);padding:12px 14px;min-width:0}
.dfh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:600}.dfh>span{min-width:0;overflow-wrap:anywhere}
.dfc h4{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);margin:12px 0 2px}
.plist{list-style:none}.plist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--br);font-size:12.5px;color:var(--t2)}.plist li:first-child{border-top:0}.plist li b{text-align:right;color:var(--ok);font-size:12.5px;max-width:52%}.plist li b.nw{white-space:nowrap}
.segs2{display:inline-flex;border:1px solid var(--br);border-radius:999px;background:var(--bg3);padding:3px;gap:2px;margin-top:6px}
.segs2 button{border-radius:999px;font-size:12.5px;font-weight:500;padding:7px 14px;color:var(--t3)}.segs2 button.on{background:var(--bg2);color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmpw{overflow-x:auto;margin:10px -16px 0;padding:0 16px 6px;-webkit-overflow-scrolling:touch}
.pc .cmpw{margin:10px 0 0;padding:0}
.cmp{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.cmp th,.cmp td{padding:8px 10px;border-bottom:1px solid var(--br);text-align:center;background:var(--bg2);min-width:118px;vertical-align:middle}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;z-index:1;text-align:left;min-width:128px;max-width:150px;color:var(--t2);font-weight:500;background:var(--bg3);border-right:1px solid var(--br)}
.pc .cmp th:first-child,.pc .cmp td:first-child{max-width:none;min-width:260px}
.cmp thead th{vertical-align:top;font-weight:600}.cmp thead .oN{display:block;margin-top:5px;line-height:1.25;font-size:12px}.cmp thead .bd{margin:4px 2px 0}
.cmp tr.df td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.cmp td.bst{background:rgba(31,157,85,.10)}.cmp td.bst small{color:var(--ok);font-weight:700}
.cmp .y{color:var(--ok);font-weight:700;font-size:15px}.cmp .n{color:var(--t4)}.cmp small.nc{color:var(--t3);font-weight:400}.cmp .o{color:#B26A00;font-weight:700;font-size:15px}.cmp small{display:block;font-size:10.5px;color:var(--t2);font-weight:500}
.cmp .bh td{background:var(--bg4);color:var(--t1);font-weight:600;text-align:left;cursor:pointer;position:static;border-right:0;max-width:none;padding:7px 10px}
.cmp .bh .ic{width:22px;height:22px;margin-right:8px}.cmp .bh .ch{float:right;font-style:normal;color:var(--t3);font-size:18px;line-height:1;transition:transform .2s}.cmp tbody.blk:not(.shut) .bh .ch{transform:rotate(90deg)}
.cmp tbody.shut tr:not(.bh){display:none}
.cmp .empty{padding:22px;color:var(--t3)}
.tips{display:flex;flex-direction:column;gap:8px;margin-top:10px}

  $('lead').innerHTML=(N>1?T.leadN:T.lead1)(po?T.tuP(esc(po)):T.tuV);
  $('kpi').style.display=REC&&isFinite(REC.o.q)?'':'none';
  if(REC&&isFinite(REC.o.q)){
    const o=REC.o,c=REC.c;
    $('kpiL').innerHTML=`${T.recT}<br>${o.d?T.kpiLd:T.kpiL}`;$('kpiV').textContent=eur(o.q);
    $('kpiS').textContent=`${c.name} · ${optName(o)} · ${T.perM(eur(o.q/12))}`+(o.p?` · ${T.pend}`:'');
    $('kpiLg').innerHTML=c.k?`<i class="lg lg-${c.k}"></i>`:'';
    $('kpi').onclick=()=>$('prCard').scrollIntoView({behavior:'smooth',block:'start'});
  }
  paintPrice();paintCap();paintDiff();paintCmp();
  const hm=fmtHome();
  $('homeCard').style.display=hm.length?'':'none';
  $('home').innerHTML=hm.map(([k,v])=>`<div><span class="tk">${esc(T.hk[k])}</span><span class="tv2">${esc(v)}</span></div>`).join('');
  $('foot').textContent=T.foot+(CC.some(c=>!c.occ)?T.footO:'');
  const pick=REC||FLAT[0];
  const wa=T.wa(`${pick.c.name}, ${optName(pick.o)}`);
  $('aWa').href=`https://wa.me/${TEL}?text=${encodeURIComponent(wa)}`;
  $('aMail').href=`mailto:${MAIL}?subject=${encodeURIComponent(T.mailSub)}&body=${encodeURIComponent(wa)}`;
}
render();
$('cmpSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){ONLYD=b.dataset.m==='d';paintCmp();}});
$('cmp').addEventListener('click',e=>{const t=e.target.closest('.bh');if(t){const k=t.dataset.b;paintCmp.shut[k]=!paintCmp.shut[k];paintCmp();}});
$('open').onclick=()=>$('sheet').classList.add('open');
$('close').onclick=()=>$('sheet').classList.remove('open');
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('open');};
addEventListener('scroll',()=>{const h=document.documentElement;$('prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.05});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
</script>
<script>
(function(){var s=document.createElement('script');s.textContent=document.getElementById('engine').textContent;document.body.appendChild(s);})();
</script>
</body>
